[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Explicit package target. Historically required because of a top-level
# `models/` directory (now renamed to `checkpoints/`) that confused
# hatchling's auto-discovery into shipping a wheel missing
# `src/pyro_dcm/models/`. Kept explicit for forward stability.
[tool.hatch.build.targets.wheel]
packages = ["src/pyro_dcm"]

[project]
name = "pyro-dcm"
version = "0.1.0"
description = "Neural amortized Dynamic Causal Modeling with Pyro"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "torch>=2.0",
    "torchdiffeq",
    "pyro-ppl>=1.9",
    "scipy",
    "numpy",
    "zuko>=1.2",
]

[project.optional-dependencies]
benchmark = [
    "matplotlib",
    "tabulate",
]
mne = [
    "mne>=1.6",
    "mne-bids>=0.14",
]
foundation = [
    "nilearn>=0.10.3",
    "huggingface_hub>=0.20",
    "braindecode>=1.3.0",
]
latent = [
    "neurogym>=2.2",
    "scikit-learn>=1.3",
]
sbi = [
    "sbi>=0.22",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
ignore = [
    "D100",  # missing docstring in public module
    "D104",  # missing docstring in public package
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "spm: marks tests requiring MATLAB + SPM12 (deselect with '-m \"not spm\"')",
    "tapas: marks tests requiring tapas rDCM MATLAB toolbox",
    "mne: marks tests requiring MNE-Python (run with '-m mne', skip with '-m \"not mne\"')",
    "foundation: marks tests requiring foundation model deps (nilearn, huggingface_hub, braindecode)",
    "latent: marks tests requiring neurogym + scikit-learn (run with '-m latent', skip with '-m \"not latent\"')",
]
